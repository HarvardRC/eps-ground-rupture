# Builds the companion site and deploys it to GitHub Pages. Builds with
# --strict, so a dead internal link or a bad config fails the run instead
# of publishing a damaged site. See subprojects/mkdocs/DEPLOY.md.
#
# Publishing model: only pushes to main deploy. Pull requests touching the
# site run the same strict build as a validation check, without deploying.

name: Companion site

on:
  push:
    branches: [main]
    paths:
      - 'subprojects/mkdocs/**'
      - 'subprojects/python/pyproject.toml'
      - 'subprojects/python/poetry.lock'
      - '.github/workflows/mkdocs.yml'
  pull_request:
    paths:
      - 'subprojects/mkdocs/**'
      - 'subprojects/python/pyproject.toml'
      - 'subprojects/python/poetry.lock'
      - '.github/workflows/mkdocs.yml'
  # Manual publish without waiting for a push. NB: the github-pages
  # environment only permits deploys from main, so dispatch from another
  # branch will build but not deploy.
  workflow_dispatch:

# Least privilege: only the deploy job gets Pages write access.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: pipx install poetry

      # The docs toolchain is a dependency group of the python subproject, so
      # there is one lockfile for the whole repo. --only docs skips pandas /
      # pyarrow / duckdb, which the site does not need; --no-root skips
      # installing the pipeline package itself.
      #
      # subprojects/python/poetry.toml sets virtualenvs.create = false, so
      # Poetry installs into whatever venv is ACTIVE. We must therefore make
      # one first: without it Poetry targets the runner's system Python and
      # fails trying to replace root-owned packages that ship with the image
      # (jinja2 is one, and mkdocs-material needs a newer one).
      # This mirrors the documented local workflow — activate, then install.
      - name: Install docs dependencies
        working-directory: subprojects/python
        run: |
          python -m venv .venv
          source .venv/bin/activate
          poetry install --only docs --no-root

      # Run from the mkdocs directory, not via `mkdocs -f`: pymdownx.snippets
      # resolves base_path from the working directory, so building from
      # elsewhere cannot find docs/includes/abbreviations.md.
      - name: Build site
        working-directory: subprojects/mkdocs
        run: ../python/.venv/bin/mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: subprojects/mkdocs/site

  deploy:
    # PRs only validate the build; publishing happens on push to main.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # configure-pages runs here rather than in `build` because it calls the
    # Pages API, which needs the `pages` permission this job grants and the
    # build job deliberately withholds. (Its usual role — exporting a base
    # URL for the build — is not needed: mkdocs.yml already sets site_url.)
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
