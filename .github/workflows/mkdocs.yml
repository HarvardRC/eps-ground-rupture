# Builds the companion site and deploys it to GitHub Pages. Builds with
# --strict, so a dead internal link or a bad config fails the run instead
# of publishing a damaged site. See subprojects/mkdocs/DEPLOY.md.
#
# Publishing model (docs/app/ddd.md §6.3):
# - A push to main that touches the paths below builds, checks, and
#   deploys.
# - A push to a dev-v.* branch that touches the same paths, and every pull
#   request (unfiltered), run the same checks and strict builds as
#   validation, without deploying.
# - A manual run (workflow_dispatch) deploys from a branch the github-pages
#   environment admits: main always, dev-v.0.4.x from owner action OA-20
#   until OA-21. On any other branch it builds, then fails at the
#   environment in `deploy` and deploys nothing.
# deploy runs only after webapp-bundle and build succeed on the same
# commit, so a failed check, bundle build, data retrieval, or site build
# fails the run and leaves the published site as it was. Only the runs
# whose deploy job runs — a push to main and every manual run — share the
# `pages` concurrency group, so a pull-request run or a push run on a
# dev-v.* branch never cancels a pending deploy.

name: Companion site

on:
  push:
    branches: [main, 'dev-v.*']
    paths:
      - 'subprojects/mkdocs/**'
      - 'subprojects/python/pyproject.toml'
      - 'subprojects/python/poetry.lock'
      - 'subprojects/python/poetry.toml'
      - 'subprojects/python/build.gradle.kts'
      - 'subprojects/webapp/**'
      - '!subprojects/webapp/perf/**'
      - 'subprojects/webapp/data/pointer.json'
      - 'CITATION.cff'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'deploy/terraform/build.gradle.kts'
      - 'gradlew'
      - 'gradle/wrapper/**'
      - '.github/workflows/mkdocs.yml'
  pull_request:
  # Manual run: builds, checks, and deploys from the branch it runs on, if
  # the github-pages environment admits that branch — main always,
  # dev-v.0.4.x from OA-20 until OA-21. On any other branch `deploy` fails
  # at the environment and nothing is deployed.
  workflow_dispatch:

# Least privilege: only the deploy job gets Pages write access.
permissions:
  contents: read

concurrency:
  group: "${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'pages' || format('pages-{0}-{1}', github.event_name, github.ref) }}"
  cancel-in-progress: false

jobs:
  # The webapp build job, separate from the MkDocs job (ADR-0011;
  # docs/app/ddd.md §6.3): type check and unit tests, then the bundle,
  # handed to `build` as the workflow artifact webapp-dist.
  webapp-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Webapp checks
        run: ./gradlew :subprojects:webapp:check

      - name: Build bundle
        run: ./gradlew :subprojects:webapp:webappBundle

      - uses: actions/upload-artifact@v7
        with:
          name: webapp-dist
          path: subprojects/webapp/build/dist/

  build:
    needs: webapp-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: pipx install poetry

      # The docs toolchain is a dependency group of the python subproject, so
      # there is one lockfile for the whole repo. --only docs skips pandas /
      # pyarrow / duckdb, which the site does not need; --no-root skips
      # installing the pipeline package itself.
      #
      # subprojects/python/poetry.toml sets virtualenvs.create = false, so
      # Poetry installs into whatever venv is ACTIVE. We must therefore make
      # one first: without it Poetry targets the runner's system Python and
      # fails trying to replace root-owned packages that ship with the image
      # (jinja2 is one, and mkdocs-material needs a newer one).
      # This mirrors the documented local workflow — activate, then install.
      - name: Install docs dependencies
        working-directory: subprojects/python
        run: |
          python -m venv .venv
          source .venv/bin/activate
          poetry install --only docs --no-root

      - name: Download webapp bundle
        uses: actions/download-artifact@v8
        with:
          name: webapp-dist
          path: subprojects/webapp/build/dist/

      # Stages the bundle under content-hashed names and the pinned data
      # vintage into docs/assets/scenario/ (docs/app/ddd.md §6.1):
      # fetchVintage runs first, checking that the pointer's data release is
      # a published prerelease, downloading its files with gh, and verifying
      # every SHA-256. The bundle task is excluded because the webapp-bundle
      # job's artifact already populates its output.
      - name: Stage scenario assets
        run: ./gradlew :subprojects:mkdocs:scenarioAssets -x :subprojects:webapp:webappBundle
        env:
          GH_TOKEN: ${{ github.token }}

      # Run from the mkdocs directory, not via `mkdocs -f`: pymdownx.snippets
      # resolves base_path from the working directory, so building from
      # elsewhere cannot find docs/includes/abbreviations.md.
      - name: Build site
        working-directory: subprojects/mkdocs
        run: ../python/.venv/bin/mkdocs build --strict

      # The preview configuration (mkdocs.preview.yml): every product draft
      # included, into site-preview/, which is validated here and never
      # uploaded or deployed.
      - name: Build preview site
        working-directory: subprojects/mkdocs
        run: ../python/.venv/bin/mkdocs build --strict -f mkdocs.preview.yml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: subprojects/mkdocs/site

  deploy:
    # Publishes only on a push to main or a manual run; pull requests and
    # pushes to a dev-v.* branch skip this job and validate only. A manual
    # run deploys only from a branch the github-pages environment admits
    # (main always, dev-v.0.4.x from OA-20 until OA-21) and fails here on
    # any other. `needs: build`, which needs webapp-bundle, keeps a commit
    # that failed any check in this run off the site.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    # configure-pages runs here rather than in `build` because it calls the
    # Pages API, which needs the `pages` permission this job grants and the
    # build job deliberately withholds. (Its usual role — exporting a base
    # URL for the build — is not needed: mkdocs.yml already sets site_url.)
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
