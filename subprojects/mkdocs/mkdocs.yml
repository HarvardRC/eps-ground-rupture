site_name: EPS Ground Rupture — interactive companion
site_description: >-
  An interactive companion to Chiama et al. (2025), Earthquake Spectra —
  the paper's figures re-experienced as live Tableau Public dashboards.
site_url: https://harvardrc.github.io/eps-ground-rupture/

repo_url: https://github.com/HarvardRC/eps-ground-rupture
repo_name: HarvardRC/eps-ground-rupture
edit_uri: edit/main/subprojects/mkdocs/docs/

# Site authorship: Kristen Chiama, Andreas Plesch, John H. Shaw —
# CONFIRMED by Kristen 2026-08-20 ("let's go with this author list as these
# are the primary contributors to the data, resources, and figures"). The
# earlier candidates (William Bednarz, Robb Moss, Michael Bouzinier) were
# considered and not added; reopen only if the author team asks.
#
# The names render via `copyright` below (site footer) and the "Site authors"
# section of docs/index.md — Material has no built-in authors key, so those
# two places are the source of truth. Keep them in step.
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HarvardRC/eps-ground-rupture
      name: Source repository

# Footer. Three kinds of material, three sets of terms — the repository
# README carries the full statement, including what the figures are shown
# under and why the datasets are not covered here.
copyright: >-
  © The Author(s) 2025. Site by Kristen Chiama, Andreas Plesch and John H. Shaw.
  Text <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>,
  code <a href="https://www.apache.org/licenses/LICENSE-2.0">Apache-2.0</a>;
  figures reproduced from the paper are © The Author(s) and shown for
  non-commercial use without modification. See the
  <a href="https://github.com/HarvardRC/eps-ground-rupture#licensing">repository</a>
  for details.

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    # A nested, always-open tree in the left sidebar: top-level entries with
    # their children indented beneath them. `navigation.sections` is
    # deliberately NOT enabled — it flattens a section into a bold label and
    # loses the visible parent/child relationship.
    # NB: Material only shows this sidebar at viewport widths >= 76.25em
    # (~1220px); below that it collapses into the hamburger menu.
    - navigation.expand
    # Previous/next links at the foot of every page, so the site reads as a
    # sequence rather than a set of dead ends.
    - navigation.footer
    - navigation.top
    - content.code.copy
    # Upgrades the acronym tooltips from bare `title` attributes (invisible
    # on touch, unreachable by keyboard) to Material's accessible ones.
    - content.tooltips
    - toc.follow
  # Pinned to light (Michael, 2026-08-17). The Tableau embeds render
  # light-mode regardless of the site scheme (visual-identity.md), so the
  # slate scheme just framed every page's main content in a bright white
  # box. One scheme, no toggle.
  palette:
    scheme: default
    # `custom` hands primary/accent to extra.css, where they come from the
    # paper's own scarp-class palette instead of a Material preset — see the
    # "Identity" block there. Ink for chrome; Monoclinal Collapse (#3f67b1)
    # for links and controls, the one palette member that clears 4.5:1 on
    # white (the 2026-08-16 review measured the others).
    primary: custom
    accent: custom

  # Body sans plus a serif for headings. The site accompanies a journal
  # article; Material's default Roboto reads like tool documentation.
  # `font.text` governs body only — headings are switched in extra.css.
  font:
    text: Source Sans 3
    code: Source Code Pro

nav:
  - Home: index.md
  - Glossary: glossary.md
  - Dashboards:
      - Model vs reality: dashboards/model-vs-reality.md
      - Response curves: dashboards/response-curves.md
      - Per-event boxplots: dashboards/per-event-boxplots.md
      - Slip regression: dashboards/slip-regression.md
      - Distributions: dashboards/distributions.md
  - Data: data.md
  - The paper: paper.md
  - Figures: figures.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  # The glossary is written as definition lists; without this they render as
  # paragraphs with a literal leading colon.
  - def_list
  # Hover tooltips on every acronym, site-wide. The definitions live in
  # docs/includes/abbreviations.md and are appended to every page by the
  # snippets extension below, so no page carries any per-term markup.
  - abbr
  - pymdownx.snippets:
      base_path: [docs]
      auto_append: [includes/abbreviations.md]
      check_paths: true
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

# The Tableau Embedding API v3 is loaded once here rather than repeated in
# every page, so the <tableau-viz> web component is defined site-wide.
# See EMBEDS.md (alongside this file) for the markup pattern each page reuses.
extra_javascript:
  - path: https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js
    type: module
  # Scales each embed to the available column width — see the file header.
  - javascripts/tableau-fit.js
  # Turns the "How to cite" buttons into one shared modal — see the file
  # header and includes/cite.md.
  - javascripts/cite-modal.js
  # Lets a link to a paper figure open it in place rather than navigating
  # away — see the file header.
  - javascripts/figure-modal.js

extra_css:
  - stylesheets/extra.css

# The abbreviation definitions are an include, not a page.
exclude_docs: |
  includes/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  # Deep links into the glossary are load-bearing, and a broken #anchor is
  # only INFO by default — which --strict ignores. Promote it.
  anchors: warn
