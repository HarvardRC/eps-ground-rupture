&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;

    &quot;codex-visualization-widget-state&quot;,
  );

  initialStateElement?.remove();

  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();

    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,

      },
    );

   * @param {string} property
   */

    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  const postToHost = (type, payload) =&gt; {

   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||

    }

      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);

                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }

    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

@media(max-width:700px){#gre-journey-preview .gre-layout{grid-template-columns:1fr}#gre-journey-preview .gre-sidebar{padding:12px 18px;border-right:0;border-bottom:1px solid var(--gre-line)}#gre-journey-preview .gre-nav{display:flex;flex-wrap:wrap;gap:4px;margin:0}#gre-journey-preview .gre-nav button{width:auto;font-size:12px;padding:5px}#gre-journey-preview .gre-sidebar .gre-eyebrow,#gre-journey-preview .gre-side-note{display:none}#gre-journey-preview .gre-main{padding:22px 18px}#gre-journey-preview .gre-top{padding:15px 18px}#gre-journey-preview .gre-product h1{font-size:26px}#gre-journey-preview .gre-variant{min-height:900px}}
@media(max-width:440px){#gre-journey-preview .gre-fields{grid-template-columns:1fr}#gre-journey-preview .gre-review-row{grid-template-columns:1fr auto;gap:4px}#gre-journey-preview .gre-review-row&gt;span:first-child{grid-column:1}#gre-journey-preview .gre-review-value{grid-column:1}#gre-journey-preview .gre-review-row&gt;button{grid-column:2;grid-row:1/3}#gre-journey-preview .gre-outcome{grid-template-columns:1fr;gap:3px}#gre-journey-preview .gre-statline{grid-template-columns:1fr}#gre-journey-preview .gre-research{display:none}#gre-journey-preview .gre-chip{min-height:40px}#gre-journey-preview .gre-variant{min-height:1100px}}
&lt;/style&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;gre-journey-preview&#x27;);
  const stages = [&#x27;Start here&#x27;,&#x27;Site conditions&#x27;,&#x27;Fault movement&#x27;,&#x27;Review scenario&#x27;,&#x27;Explore results&#x27;];
  const defs = {
    dip:{name:&#x27;Fault angle (dip)&#x27;,help:&#x27;The angle of the fault below the ground surface.&#x27;,values:[&#x27;20°&#x27;,&#x27;30°&#x27;,&#x27;40°&#x27;,&#x27;45°&#x27;,&#x27;50°&#x27;,&#x27;60°&#x27;,&#x27;70°&#x27;]},
    depth:{name:&#x27;Sediment depth&#x27;,help:&#x27;The depth of sediment above bedrock.&#x27;,values:[&#x27;3 m&#x27;,&#x27;5 m&#x27;,&#x27;10 m&#x27;]},
    density:{name:&#x27;Sediment density&#x27;,help:&#x27;How loosely or densely the sediment is packed.&#x27;,values:[&#x27;Loose&#x27;,&#x27;Medium&#x27;,&#x27;Dense&#x27;]},
    sediment:{name:&#x27;Sediment strength and structure&#x27;,help:&#x27;Choose uniform sediment or a layered profile. You can include more than one possibility.&#x27;,values:[&#x27;Uniform: Weak&#x27;,&#x27;Uniform: Moderate&#x27;,&#x27;Uniform: Strong&#x27;,&#x27;Layered: Weak&#x27;,&#x27;Layered: Moderate&#x27;,&#x27;Layered: Strong&#x27;,&#x27;Layered: Random heterogeneous&#x27;,&#x27;Layered: Cohesive top unit&#x27;,&#x27;Layered: Alternating strong–weak&#x27;]}
  };
  const initial = () =&gt; ({stage:0,reached:0,dip:[],depth:[],density:[],sediment:[],mode:&#x27;slip&#x27;,min:&#x27;&#x27;,max:&#x27;&#x27;,measurement:0,reviewReturn:false});
  const states = {};
  let lastSaved = &#x27;&#x27;;
  const saved = window.openai?.widgetState?.privateContent?.journeys;
  const esc = value =&gt; String(value).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, ch =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[ch]));
  const button = (text,action,primary=false,extra=&#x27;&#x27;) =&gt; `&lt;button type=&quot;button&quot; class=&quot;gre-button ${primary?&#x27;gre-primary&#x27;:&#x27;&#x27;} cursor-interaction&quot; data-action=&quot;${action}&quot; ${extra}&gt;${text}&lt;/button&gt;`;
  const labelFor = (s,key) =&gt; s[key].length ? s[key].join(&#x27;, &#x27;) : &#x27;Not specified · all modeled values&#x27;;
  function movement(s){if(s.mode===&#x27;offset&#x27;)return s.max?`Vertical ground offset: 0–${s.max} m`:&#x27;Vertical ground offset: not entered&#x27;;if(!s.min&amp;&amp;!s.max)return &#x27;Not specified · all recorded stages&#x27;;return s.max?`Fault slip at depth: ${s.min||&#x27;0&#x27;}–${s.max} m`:`Fault slip at depth: ${s.min} m to recorded maximum`;}
  function store(){lastSaved=JSON.stringify(states);if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{prototype:&#x27;Scenario journey&#x27;,choices:states},privateContent:{journeys:states}}).catch(()=&gt;{});}
  function cleanState(value){const s=initial();if(!value||typeof value!==&#x27;object&#x27;)return s;for(const k of Object.keys(defs))s[k]=Array.isArray(value[k])?value[k].filter(v=&gt;defs[k].values.includes(v)):[];s.stage=Number.isInteger(value.stage)&amp;&amp;value.stage&gt;=0&amp;&amp;value.stage&lt;=4?value.stage:0;s.reached=Math.max(s.stage,Number.isInteger(value.reached)&amp;&amp;value.reached&lt;=4?value.reached:0);s.mode=value.mode===&#x27;offset&#x27;?&#x27;offset&#x27;:&#x27;slip&#x27;;s.min=typeof value.min===&#x27;string&#x27;?value.min.slice(0,16):&#x27;&#x27;;s.max=typeof value.max===&#x27;string&#x27;?value.max.slice(0,16):&#x27;&#x27;;s.measurement=[0,1,2].includes(value.measurement)?value.measurement:0;return s;}
  function field(s,key){const d=defs[key];const chips=d.values.map((v,i)=&gt;`&lt;button type=&quot;button&quot; class=&quot;gre-chip cursor-interaction&quot; aria-pressed=&quot;${s[key].includes(v)}&quot; data-choice=&quot;${key}&quot; data-value=&quot;${i}&quot;&gt;${esc(v.includes(&#x27;: &#x27;)?v.split(&#x27;: &#x27;)[1]:v)}&lt;/button&gt;`);return `&lt;fieldset class=&quot;${key===&#x27;sediment&#x27;?&#x27;gre-full&#x27;:&#x27;&#x27;}&quot;&gt;&lt;legend&gt;${d.name}&lt;/legend&gt;&lt;p class=&quot;gre-helper&quot;&gt;${d.help}&lt;/p&gt;&lt;label class=&quot;gre-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-all=&quot;${key}&quot; ${!s[key].length?&#x27;checked&#x27;:&#x27;&#x27;}&gt;Not specified — include all&lt;/label&gt;${key===&#x27;sediment&#x27;?`&lt;div class=&quot;gre-arm&quot;&gt;&lt;span&gt;Uniform&lt;/span&gt;&lt;div class=&quot;gre-options&quot;&gt;${chips.slice(0,3).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;gre-arm&quot;&gt;&lt;span&gt;Layered&lt;/span&gt;&lt;div class=&quot;gre-options&quot;&gt;${chips.slice(3).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`:`&lt;div class=&quot;gre-options&quot;&gt;${chips.join(&#x27;&#x27;)}&lt;/div&gt;`}&lt;/fieldset&gt;`;}
  function foot(s,step,next){return `&lt;div class=&quot;gre-actions gre-footer&quot;&gt;${button(&#x27;Back&#x27;,&#x27;back&#x27;)}${button(s.reviewReturn&amp;&amp;step&lt;3?&#x27;Return to review&#x27;:next,&#x27;next&#x27;,true)}&lt;/div&gt;&lt;p class=&quot;gre-status&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;`;}
  function review(s){return `&lt;div class=&quot;gre-review&quot;&gt;${Object.keys(defs).map(k=&gt;`&lt;div class=&quot;gre-review-row&quot;&gt;&lt;span&gt;${defs[k].name}&lt;/span&gt;&lt;span class=&quot;gre-review-value&quot;&gt;${esc(labelFor(s,k))}&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;gre-textbutton cursor-interaction&quot; data-edit=&quot;1&quot;&gt;Edit&lt;/button&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;div class=&quot;gre-review-row&quot;&gt;&lt;span&gt;Fault movement&lt;/span&gt;&lt;span class=&quot;gre-review-value&quot;&gt;${esc(movement(s))}&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;gre-textbutton cursor-interaction&quot; data-edit=&quot;2&quot;&gt;Edit&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;}
  function content(s,step){
    if(step===0)return `&lt;div class=&quot;gre-eyebrow&quot;&gt;Build a scenario. Understand the results.&lt;/div&gt;&lt;h1&gt;Use simulations to understand ground rupture.&lt;/h1&gt;&lt;p class=&quot;gre-lead&quot;&gt;Describe the site conditions and fault movement you want to investigate, then see the simulated results.&lt;/p&gt;&lt;div class=&quot;gre-outcomes&quot;&gt;&lt;div class=&quot;gre-outcome&quot;&gt;&lt;h3&gt;Scarp height&lt;/h3&gt;&lt;span&gt;The vertical step in the ground.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;gre-outcome&quot;&gt;&lt;h3&gt;Deformation-zone width&lt;/h3&gt;&lt;span&gt;The width of the main disturbed zone.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;gre-outcome&quot;&gt;&lt;h3&gt;Scarp dip&lt;/h3&gt;&lt;span&gt;The steepness of the scarp face.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;gre-actions&quot;&gt;${button(&#x27;Build your scenario&#x27;,&#x27;next&#x27;,true)}${button(&#x27;Try sample inputs&#x27;,&#x27;sample&#x27;)}&lt;/div&gt;&lt;p class=&quot;gre-disclaimer&quot;&gt;This is a research tool; it does not predict what will happen at a particular site.&lt;/p&gt;&lt;p class=&quot;gre-helper&quot;&gt;Results come from an existing set of research simulations.&lt;/p&gt;`;
    if(step===1)return `&lt;h2&gt;Describe the site conditions&lt;/h2&gt;&lt;p class=&quot;gre-helper&quot;&gt;Select the conditions you want to investigate. Include several possibilities when you are uncertain, or leave a condition unspecified.&lt;/p&gt;&lt;div class=&quot;gre-fields&quot;&gt;${field(s,&#x27;dip&#x27;)}${field(s,&#x27;depth&#x27;)}${field(s,&#x27;density&#x27;)}${field(s,&#x27;sediment&#x27;)}&lt;/div&gt;${foot(s,1,&#x27;Continue to fault movement&#x27;)}`;
    if(step===2)return `&lt;h2&gt;Choose the assumed fault movement&lt;/h2&gt;&lt;p class=&quot;gre-helper&quot;&gt;Describe the movement you want to investigate. This is an assumption for your scenario.&lt;/p&gt;&lt;label class=&quot;gre-radio&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;${s.layout}-movement&quot; data-mode=&quot;slip&quot; ${s.mode===&#x27;slip&#x27;?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;span&gt;Fault movement at depth (slip)&lt;small&gt;The distance the fault moves underground.&lt;/small&gt;&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;gre-radio&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;${s.layout}-movement&quot; data-mode=&quot;offset&quot; ${s.mode===&#x27;offset&#x27;?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;span&gt;Vertical ground offset at the surface&lt;small&gt;An assumed vertical difference across the rupture.&lt;/small&gt;&lt;/span&gt;&lt;/label&gt;&lt;div class=&quot;gre-inputrow&quot;&gt;${s.mode===&#x27;slip&#x27;?`&lt;label&gt;Minimum (m)&lt;input type=&quot;number&quot; min=&quot;0&quot; step=&quot;any&quot; data-number=&quot;min&quot; value=&quot;${esc(s.min)}&quot; placeholder=&quot;0&quot;&gt;&lt;/label&gt;`:&#x27;&#x27;}&lt;label&gt;Maximum (m)&lt;input type=&quot;number&quot; min=&quot;0&quot; step=&quot;any&quot; data-number=&quot;max&quot; value=&quot;${esc(s.max)}&quot; placeholder=&quot;Enter a value&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;p class=&quot;gre-helper&quot;&gt;${s.mode===&#x27;offset&#x27;?&#x27;An offset maximum represents a range from zero to your value. Results will explain the conversion to fault slip for each selected angle.&#x27;:&#x27;Leave both fields blank to include all recorded stages. Entering only a maximum includes movement from zero up to that value.&#x27;}&lt;/p&gt;&lt;p class=&quot;gre-error&quot; role=&quot;alert&quot;&gt;&lt;/p&gt;&lt;details&gt;&lt;summary&gt;What does this choice mean?&lt;/summary&gt;&lt;p class=&quot;gre-quiet&quot;&gt;Fault slip and vertical surface offset are different quantities. Surface-offset entry uses a relationship from the research to find corresponding fault slip. Coverage and conversion limitations belong beside the results.&lt;/p&gt;&lt;/details&gt;${foot(s,2,&#x27;Review your scenario&#x27;)}`;
    if(step===3)return `&lt;h2&gt;Review your scenario&lt;/h2&gt;&lt;p class=&quot;gre-helper&quot;&gt;These are the conditions the tool will use to find matching simulations. You can change any choice before exploring the results.&lt;/p&gt;${review(s)}&lt;div class=&quot;gre-callout&quot;&gt;Unspecified conditions include every modeled value for that condition. They do not mean the site has been characterized.&lt;/div&gt;&lt;details&gt;&lt;summary&gt;How simulation stages are included&lt;/summary&gt;&lt;p class=&quot;gre-quiet&quot;&gt;This proposal keeps the current default: all recorded stages within the chosen slip range. With no range, it includes all recorded stages. A later result refinement can select one state per simulation trial.&lt;/p&gt;&lt;/details&gt;${foot(s,3,&#x27;Explore matching results&#x27;)}`;
    const measures=[&#x27;Scarp height&#x27;,&#x27;Deformation-zone width&#x27;,&#x27;Scarp dip&#x27;];const units=[&#x27;m&#x27;,&#x27;m&#x27;,&#x27;°&#x27;];const heights=[[12,19,31,48,65,82,95,89,70,47,29,16,9],[8,18,38,60,83,95,88,76,54,38,25,19,11],[7,15,27,41,66,80,95,84,68,50,31,18,10]][s.measurement];
    return `&lt;h2&gt;Explore your scenario&lt;/h2&gt;&lt;p class=&quot;gre-helper&quot;&gt;Read the range of simulated results, then change a condition to investigate a different scenario.&lt;/p&gt;&lt;div class=&quot;gre-callout&quot;&gt;Layout preview: the chart is illustrative. No results have been calculated from your choices.&lt;/div&gt;&lt;div class=&quot;gre-result-tabs&quot; aria-label=&quot;Measurement&quot;&gt;${measures.map((m,i)=&gt;`&lt;button type=&quot;button&quot; class=&quot;gre-chip cursor-interaction&quot; data-measure=&quot;${i}&quot; aria-pressed=&quot;${i===s.measurement}&quot;&gt;${m}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;h3&gt;${measures[s.measurement]} (${units[s.measurement]})&lt;/h3&gt;&lt;p class=&quot;gre-helper&quot;&gt;${[&#x27;The vertical step formed at the ground surface.&#x27;,&#x27;The width of the main modeled rupture zone. Separate deformation away from the main trace is not represented.&#x27;,&#x27;The steepness of the simulated scarp face.&#x27;][s.measurement]}&lt;/p&gt;${s.measurement===2?&#x27;&lt;p class=&quot;gre-error&quot;&gt;Scarp-dip values are provisional while the research group reviews a measurement correction.&lt;/p&gt;&#x27;:&#x27;&#x27;}&lt;div class=&quot;gre-chart-label&quot;&gt;&lt;span&gt;Number of simulated measurements&lt;/span&gt;&lt;span&gt;Illustration&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;gre-chart&quot; role=&quot;img&quot; aria-label=&quot;Illustrative distribution. Not calculated from the selected scenario.&quot;&gt;${heights.map(h=&gt;`&lt;span style=&quot;height:${h}%&quot;&gt;&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;gre-chart-label&quot;&gt;&lt;span&gt;Smaller ${measures[s.measurement].toLowerCase()}&lt;/span&gt;&lt;span&gt;Larger ${measures[s.measurement].toLowerCase()} (${units[s.measurement]})&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;gre-statline&quot;&gt;&lt;div&gt;Median&lt;strong&gt;— ${units[s.measurement]}&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;16th–84th percentile range&lt;strong&gt;— ${units[s.measurement]}&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;gre-quiet&quot;&gt;These summaries describe the matching simulations. They are not recommended design values.&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Your scenario and result context&lt;/summary&gt;${review(s)}&lt;p class=&quot;gre-quiet&quot;&gt;The working result will show matching simulations, recorded stages, valid measurements, coverage limits, and any relevant warnings here and beside the affected results.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Refine the analysis&lt;/summary&gt;&lt;p class=&quot;gre-quiet&quot;&gt;Population, scarp-type filtering, chart views, and field comparisons will be defined in the next product-design pass.&lt;/p&gt;&lt;/details&gt;&lt;div class=&quot;gre-actions&quot;&gt;${button(&#x27;Change site conditions&#x27;,&#x27;edit-site&#x27;,true)}${button(&#x27;Change fault movement&#x27;,&#x27;edit-movement&#x27;)}${button(&#x27;Download result&#x27;,&#x27;download&#x27;)}&lt;/div&gt;&lt;p class=&quot;gre-status&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;&lt;p class=&quot;gre-disclaimer&quot;&gt;This is a research tool; it does not predict what will happen at a particular site.&lt;/p&gt;`;
  }
  function render(shell){const s=states[shell.dataset.layout];const side=shell.querySelector(&#x27;.gre-sidebar&#x27;);const main=shell.querySelector(&#x27;.gre-main&#x27;);side.innerHTML=`&lt;div class=&quot;gre-eyebrow&quot;&gt;Your scenario&lt;/div&gt;&lt;nav class=&quot;gre-nav&quot; aria-label=&quot;Scenario stages&quot;&gt;${stages.map((name,i)=&gt;`&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-stage=&quot;${i}&quot; ${i===s.stage?&#x27;aria-current=&quot;step&quot;&#x27;:&#x27;&#x27;} ${i&gt;s.reached?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;&lt;span class=&quot;gre-number&quot;&gt;${i+1}&lt;/span&gt;&lt;span&gt;${name}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/nav&gt;&lt;div class=&quot;gre-side-note&quot;&gt;&lt;h3&gt;Selected conditions&lt;/h3&gt;&lt;p&gt;${esc(labelFor(s,&#x27;dip&#x27;))}&lt;/p&gt;&lt;p&gt;${esc(movement(s))}&lt;/p&gt;&lt;p&gt;Choices stay available as you move between stages.&lt;/p&gt;&lt;/div&gt;`;main.innerHTML=s.layout===&#x27;steps&#x27;?content(s,s.stage):stages.map((name,i)=&gt;`&lt;section class=&quot;gre-page-section&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;gre-sectionhead cursor-interaction&quot; data-stage=&quot;${i}&quot; aria-expanded=&quot;${s.stage===i}&quot; ${i&gt;s.reached?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;&lt;span class=&quot;gre-number&quot;&gt;${i+1}&lt;/span&gt;${name}&lt;small&gt;${i===s.stage?&#x27;Open&#x27;:i&lt;=s.reached?&#x27;Revisit&#x27;:&#x27;Next&#x27;}&lt;/small&gt;&lt;/button&gt;${s.stage===i?`&lt;div class=&quot;gre-sectionbody&quot;&gt;${content(s,i)}&lt;/div&gt;`:&#x27;&#x27;}&lt;/section&gt;`).join(&#x27;&#x27;);}
  function validate(shell,s){const rawMin=s.mode===&#x27;slip&#x27;?s.min:&#x27;&#x27;;const min=rawMin===&#x27;&#x27;?0:Number(rawMin), max=s.max===&#x27;&#x27;?null:Number(s.max);let message=&#x27;&#x27;;if(s.mode===&#x27;offset&#x27;&amp;&amp;s.max===&#x27;&#x27;)message=&#x27;Enter the maximum vertical offset you want to investigate.&#x27;;else if((rawMin!==&#x27;&#x27;&amp;&amp;(!Number.isFinite(min)||min&lt;0))||(max!==null&amp;&amp;(!Number.isFinite(max)||max&lt;0)))message=&#x27;Enter a value of zero or greater.&#x27;;else if(max!==null&amp;&amp;min&gt;max)message=&#x27;The maximum must be at least the minimum.&#x27;;else if(s.mode===&#x27;slip&#x27;&amp;&amp;((max!==null&amp;&amp;max&gt;5.0135)||min&gt;5.0135))message=&#x27;Choose fault slip within the recorded range, up to 5.0135 m.&#x27;;const error=shell.querySelector(&#x27;.gre-error[role=&quot;alert&quot;]&#x27;);if(error)error.textContent=message;return !message;}
  root.querySelectorAll(&#x27;.gre-product&#x27;).forEach(shell=&gt;{const layout=shell.dataset.layout;states[layout]=cleanState(saved?.[layout]);states[layout].layout=layout;render(shell);
    shell.addEventListener(&#x27;input&#x27;,event=&gt;{const el=event.target;if(el.matches(&#x27;[data-number]&#x27;)){states[layout][el.dataset.number]=el.value;const err=shell.querySelector(&#x27;[role=&quot;alert&quot;]&#x27;);if(err)err.textContent=&#x27;&#x27;;store();}});
    shell.addEventListener(&#x27;change&#x27;,event=&gt;{const el=event.target,s=states[layout];if(el.matches(&#x27;[data-all]&#x27;)){s[el.dataset.all]=el.checked?[]:[...defs[el.dataset.all].values];render(shell);store();}else if(el.matches(&#x27;[data-mode]&#x27;)){s.mode=el.dataset.mode;s.min=&#x27;&#x27;;s.max=&#x27;&#x27;;render(shell);store();}});
    shell.addEventListener(&#x27;click&#x27;,event=&gt;{const el=event.target.closest(&#x27;button&#x27;);if(!el||el.disabled)return;const s=states[layout], previousStage=s.stage;if(el.dataset.choice){const key=el.dataset.choice,value=defs[key].values[Number(el.dataset.value)];s[key]=s[key].includes(value)?s[key].filter(v=&gt;v!==value):[...s[key],value];}
      else if(el.dataset.measure!==undefined)s.measurement=Number(el.dataset.measure);
      else if(el.dataset.stage!==undefined){if(s.stage===2&amp;&amp;!validate(shell,s))return;s.stage=Number(el.dataset.stage);s.reviewReturn=false;}
      else if(el.dataset.edit){s.stage=Number(el.dataset.edit);s.reviewReturn=true;}
      else if(el.dataset.action===&#x27;next&#x27;){if(s.stage===2&amp;&amp;!validate(shell,s))return;s.stage=s.reviewReturn&amp;&amp;s.stage&lt;3?3:Math.min(4,s.stage+1);s.reviewReturn=false;s.reached=Math.max(s.reached,s.stage);}
      else if(el.dataset.action===&#x27;back&#x27;){s.stage=Math.max(0,s.stage-1);s.reviewReturn=false;}
      else if(el.dataset.action===&#x27;sample&#x27;){s.dip=[&#x27;30°&#x27;,&#x27;40°&#x27;];s.sediment=[&#x27;Uniform: Strong&#x27;,&#x27;Layered: Strong&#x27;];s.mode=&#x27;offset&#x27;;s.max=&#x27;3&#x27;;s.stage=1;s.reached=Math.max(s.reached,1);}

  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const sizeStorageKey = `${storageKey}:share-size-v1`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
