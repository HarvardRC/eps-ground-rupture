  <section data-variant="Focused steps" aria-label="Focused steps" class="gre-variant">

    <div class="gre-product" data-layout="steps" aria-label="Focused steps design">
      <header class="gre-top"><span class="gre-brand">Ground Rupture Explorer</span><span class="gre-research">Research companion</span></header>
      <div class="gre-layout"><aside class="gre-sidebar"></aside><main class="gre-main"></main></div>
    </div>
  </section>
  <section data-variant="Guided page" aria-label="Guided page" class="gre-variant" hidden>
    <div class="gre-preview-note">Interaction proposal · Results are illustrative</div>
    <div class="gre-product" data-layout="page" aria-label="Guided page design">
      <header class="gre-top"><span class="gre-brand">Ground Rupture Explorer</span><span class="gre-research">Research companion</span></header>

</div>
<style>

#gre-journey-preview .gre-textbutton{background:transparent;border:0;color:var(--gre-brand);font:13px/1.5 Arial,sans-serif;text-decoration:underline;padding:0;min-height:24px}

#gre-journey-preview .gre-result-tabs{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0 14px}
#gre-journey-preview .gre-chart{height:145px;display:flex;gap:5px;align-items:flex-end;padding:10px 18px 0;border-bottom:1px solid var(--gre-line);border-left:1px solid var(--gre-line);margin:10px 0}
#gre-journey-preview .gre-chart span{flex:1;background:var(--gre-brand);opacity:.5;min-width:0}
#gre-journey-preview .gre-chart-label{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--gre-muted)}

#gre-journey-preview .gre-sectionhead{display:flex;align-items:center;gap:10px;width:100%;padding:15px 0;text-align:left;border:0;background:transparent;color:var(--gre-text);font:16px/1.4 Arial,sans-serif}
#gre-journey-preview .gre-sectionhead:disabled{color:var(--gre-muted);opacity:.6}

@media(max-width:700px){#gre-journey-preview .gre-layout{grid-template-columns:1fr}#gre-journey-preview .gre-sidebar{padding:12px 18px;border-right:0;border-bottom:1px solid var(--gre-line)}#gre-journey-preview .gre-nav{display:flex;flex-wrap:wrap;gap:4px;margin:0}#gre-journey-preview .gre-nav button{width:auto;font-size:12px;padding:5px}#gre-journey-preview .gre-sidebar .gre-eyebrow,#gre-journey-preview .gre-side-note{display:none}#gre-journey-preview .gre-main{padding:22px 18px}#gre-journey-preview .gre-top{padding:15px 18px}#gre-journey-preview .gre-product h1{font-size:26px}#gre-journey-preview .gre-variant{min-height:900px}}
@media(max-width:440px){#gre-journey-preview .gre-fields{grid-template-columns:1fr}#gre-journey-preview .gre-review-row{grid-template-columns:1fr auto;gap:4px}#gre-journey-preview .gre-review-row>span:first-child{grid-column:1}#gre-journey-preview .gre-review-value{grid-column:1}#gre-journey-preview .gre-review-row>button{grid-column:2;grid-row:1/3}#gre-journey-preview .gre-outcome{grid-template-columns:1fr;gap:3px}#gre-journey-preview .gre-statline{grid-template-columns:1fr}#gre-journey-preview .gre-research{display:none}#gre-journey-preview .gre-chip{min-height:40px}#gre-journey-preview .gre-variant{min-height:1100px}}
</style>
<script>
(() => {
  const root = document.getElementById('gre-journey-preview');
  const stages = ['Start here','Site conditions','Fault movement','Review scenario','Explore results'];
  const defs = {
    dip:{name:'Fault angle (dip)',help:'The angle of the fault below the ground surface.',values:['20°','30°','40°','45°','50°','60°','70°']},
    depth:{name:'Sediment depth',help:'The depth of sediment above bedrock.',values:['3 m','5 m','10 m']},
    density:{name:'Sediment density',help:'How loosely or densely the sediment is packed.',values:['Loose','Medium','Dense']},
    sediment:{name:'Sediment strength and structure',help:'Choose uniform sediment or a layered profile. You can include more than one possibility.',values:['Uniform: Weak','Uniform: Moderate','Uniform: Strong','Layered: Weak','Layered: Moderate','Layered: Strong','Layered: Random heterogeneous','Layered: Cohesive top unit','Layered: Alternating strong–weak']}
  };
  const initial = () => ({stage:0,reached:0,dip:[],depth:[],density:[],sediment:[],mode:'slip',min:'',max:'',measurement:0,reviewReturn:false});
  const states = {};
  let lastSaved = '';
  const saved = window.openai?.widgetState?.privateContent?.journeys;
  const esc = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const button = (text,action,primary=false,extra='') => `<button type="button" class="gre-button ${primary?'gre-primary':''} cursor-interaction" data-action="${action}" ${extra}>${text}</button>`;
  const labelFor = (s,key) => s[key].length ? s[key].join(', ') : 'Not specified · all modeled values';
  function movement(s){if(s.mode==='offset')return s.max?`Vertical ground offset: 0–${s.max} m`:'Vertical ground offset: not entered';if(!s.min&&!s.max)return 'Not specified · all recorded stages';return s.max?`Fault slip at depth: ${s.min||'0'}–${s.max} m`:`Fault slip at depth: ${s.min} m to recorded maximum`;}
  function store(){lastSaved=JSON.stringify(states);if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{prototype:'Scenario journey',choices:states},privateContent:{journeys:states}}).catch(()=>{});}
  function cleanState(value){const s=initial();if(!value||typeof value!=='object')return s;for(const k of Object.keys(defs))s[k]=Array.isArray(value[k])?value[k].filter(v=>defs[k].values.includes(v)):[];s.stage=Number.isInteger(value.stage)&&value.stage>=0&&value.stage<=4?value.stage:0;s.reached=Math.max(s.stage,Number.isInteger(value.reached)&&value.reached<=4?value.reached:0);s.mode=value.mode==='offset'?'offset':'slip';s.min=typeof value.min==='string'?value.min.slice(0,16):'';s.max=typeof value.max==='string'?value.max.slice(0,16):'';s.measurement=[0,1,2].includes(value.measurement)?value.measurement:0;return s;}
  function field(s,key){const d=defs[key];const chips=d.values.map((v,i)=>`<button type="button" class="gre-chip cursor-interaction" aria-pressed="${s[key].includes(v)}" data-choice="${key}" data-value="${i}">${esc(v.includes(': ')?v.split(': ')[1]:v)}</button>`);return `<fieldset class="${key==='sediment'?'gre-full':''}"><legend>${d.name}</legend><p class="gre-helper">${d.help}</p><label class="gre-check"><input type="checkbox" data-all="${key}" ${!s[key].length?'checked':''}>Not specified — include all</label>${key==='sediment'?`<div class="gre-arm"><span>Uniform</span><div class="gre-options">${chips.slice(0,3).join('')}</div></div><div class="gre-arm"><span>Layered</span><div class="gre-options">${chips.slice(3).join('')}</div></div>`:`<div class="gre-options">${chips.join('')}</div>`}</fieldset>`;}
  function foot(s,step,next){return `<div class="gre-actions gre-footer">${button('Back','back')}${button(s.reviewReturn&&step<3?'Return to review':next,'next',true)}</div><p class="gre-status" role="status" aria-live="polite"></p>`;}
  function review(s){return `<div class="gre-review">${Object.keys(defs).map(k=>`<div class="gre-review-row"><span>${defs[k].name}</span><span class="gre-review-value">${esc(labelFor(s,k))}</span><button type="button" class="gre-textbutton cursor-interaction" data-edit="1">Edit</button></div>`).join('')}<div class="gre-review-row"><span>Fault movement</span><span class="gre-review-value">${esc(movement(s))}</span><button type="button" class="gre-textbutton cursor-interaction" data-edit="2">Edit</button></div></div>`;}
  function content(s,step){
    if(step===0)return `<div class="gre-eyebrow">Build a scenario. Understand the results.</div><h1>Use simulations to understand ground rupture.</h1><p class="gre-lead">Describe the site conditions and fault movement you want to investigate, then see the simulated results.</p><div class="gre-outcomes"><div class="gre-outcome"><h3>Scarp height</h3><span>The vertical step in the ground.</span></div><div class="gre-outcome"><h3>Deformation-zone width</h3><span>The width of the main disturbed zone.</span></div><div class="gre-outcome"><h3>Scarp dip</h3><span>The steepness of the scarp face.</span></div></div><div class="gre-actions">${button('Build your scenario','next',true)}${button('Try sample inputs','sample')}</div><p class="gre-disclaimer">This is a research tool; it does not predict what will happen at a particular site.</p><p class="gre-helper">Results come from an existing set of research simulations.</p>`;
    if(step===1)return `<h2>Describe the site conditions</h2><p class="gre-helper">Select the conditions you want to investigate. Include several possibilities when you are uncertain, or leave a condition unspecified.</p><div class="gre-fields">${field(s,'dip')}${field(s,'depth')}${field(s,'density')}${field(s,'sediment')}</div>${foot(s,1,'Continue to fault movement')}`;
    if(step===2)return `<h2>Choose the assumed fault movement</h2><p class="gre-helper">Describe the movement you want to investigate. This is an assumption for your scenario.</p><label class="gre-radio"><input type="radio" name="${s.layout}-movement" data-mode="slip" ${s.mode==='slip'?'checked':''}><span>Fault movement at depth (slip)<small>The distance the fault moves underground.</small></span></label><label class="gre-radio"><input type="radio" name="${s.layout}-movement" data-mode="offset" ${s.mode==='offset'?'checked':''}><span>Vertical ground offset at the surface<small>An assumed vertical difference across the rupture.</small></span></label><div class="gre-inputrow">${s.mode==='slip'?`<label>Minimum (m)<input type="number" min="0" step="any" data-number="min" value="${esc(s.min)}" placeholder="0"></label>`:''}<label>Maximum (m)<input type="number" min="0" step="any" data-number="max" value="${esc(s.max)}" placeholder="Enter a value"></label></div><p class="gre-helper">${s.mode==='offset'?'An offset maximum represents a range from zero to your value. Results will explain the conversion to fault slip for each selected angle.':'Leave both fields blank to include all recorded stages. Entering only a maximum includes movement from zero up to that value.'}</p><p class="gre-error" role="alert"></p><details><summary>What does this choice mean?</summary><p class="gre-quiet">Fault slip and vertical surface offset are different quantities. Surface-offset entry uses a relationship from the research to find corresponding fault slip. Coverage and conversion limitations belong beside the results.</p></details>${foot(s,2,'Review your scenario')}`;
    if(step===3)return `<h2>Review your scenario</h2><p class="gre-helper">These are the conditions the tool will use to find matching simulations. You can change any choice before exploring the results.</p>${review(s)}<div class="gre-callout">Unspecified conditions include every modeled value for that condition. They do not mean the site has been characterized.</div><details><summary>How simulation stages are included</summary><p class="gre-quiet">This proposal keeps the current default: all recorded stages within the chosen slip range. With no range, it includes all recorded stages. A later result refinement can select one state per simulation trial.</p></details>${foot(s,3,'Explore matching results')}`;
    const measures=['Scarp height','Deformation-zone width','Scarp dip'];const units=['m','m','°'];const heights=[[12,19,31,48,65,82,95,89,70,47,29,16,9],[8,18,38,60,83,95,88,76,54,38,25,19,11],[7,15,27,41,66,80,95,84,68,50,31,18,10]][s.measurement];
    return `<h2>Explore your scenario</h2><p class="gre-helper">Read the range of simulated results, then change a condition to investigate a different scenario.</p><div class="gre-callout">Layout preview: the chart is illustrative. No results have been calculated from your choices.</div><div class="gre-result-tabs" aria-label="Measurement">${measures.map((m,i)=>`<button type="button" class="gre-chip cursor-interaction" data-measure="${i}" aria-pressed="${i===s.measurement}">${m}</button>`).join('')}</div><h3>${measures[s.measurement]} (${units[s.measurement]})</h3><p class="gre-helper">${['The vertical step formed at the ground surface.','The width of the main modeled rupture zone. Separate deformation away from the main trace is not represented.','The steepness of the simulated scarp face.'][s.measurement]}</p>${s.measurement===2?'<p class="gre-error">Scarp-dip values are provisional while the research group reviews a measurement correction.</p>':''}<div class="gre-chart-label"><span>Number of simulated measurements</span><span>Illustration</span></div><div class="gre-chart" role="img" aria-label="Illustrative distribution. Not calculated from the selected scenario.">${heights.map(h=>`<span style="height:${h}%"></span>`).join('')}</div><div class="gre-chart-label"><span>Smaller ${measures[s.measurement].toLowerCase()}</span><span>Larger ${measures[s.measurement].toLowerCase()} (${units[s.measurement]})</span></div><div class="gre-statline"><div>Median<strong>— ${units[s.measurement]}</strong></div><div>16th–84th percentile range<strong>— ${units[s.measurement]}</strong></div></div><p class="gre-quiet">These summaries describe the matching simulations. They are not recommended design values.</p><details><summary>Your scenario and result context</summary>${review(s)}<p class="gre-quiet">The working result will show matching simulations, recorded stages, valid measurements, coverage limits, and any relevant warnings here and beside the affected results.</p></details><details><summary>Refine the analysis</summary><p class="gre-quiet">Population, scarp-type filtering, chart views, and field comparisons will be defined in the next product-design pass.</p></details><div class="gre-actions">${button('Change site conditions','edit-site',true)}${button('Change fault movement','edit-movement')}${button('Download result','download')}</div><p class="gre-status" role="status" aria-live="polite"></p><p class="gre-disclaimer">This is a research tool; it does not predict what will happen at a particular site.</p>`;
  }
  function render(shell){const s=states[shell.dataset.layout];const side=shell.querySelector('.gre-sidebar');const main=shell.querySelector('.gre-main');side.innerHTML=`<div class="gre-eyebrow">Your scenario</div><nav class="gre-nav" aria-label="Scenario stages">${stages.map((name,i)=>`<button type="button" class="cursor-interaction" data-stage="${i}" ${i===s.stage?'aria-current="step"':''} ${i>s.reached?'disabled':''}><span class="gre-number">${i+1}</span><span>${name}</span></button>`).join('')}</nav><div class="gre-side-note"><h3>Selected conditions</h3><p>${esc(labelFor(s,'dip'))}</p><p>${esc(movement(s))}</p><p>Choices stay available as you move between stages.</p></div>`;main.innerHTML=s.layout==='steps'?content(s,s.stage):stages.map((name,i)=>`<section class="gre-page-section"><button type="button" class="gre-sectionhead cursor-interaction" data-stage="${i}" aria-expanded="${s.stage===i}" ${i>s.reached?'disabled':''}><span class="gre-number">${i+1}</span>${name}<small>${i===s.stage?'Open':i<=s.reached?'Revisit':'Next'}</small></button>${s.stage===i?`<div class="gre-sectionbody">${content(s,i)}</div>`:''}</section>`).join('');}
  function validate(shell,s){const rawMin=s.mode==='slip'?s.min:'';const min=rawMin===''?0:Number(rawMin), max=s.max===''?null:Number(s.max);let message='';if(s.mode==='offset'&&s.max==='')message='Enter the maximum vertical offset you want to investigate.';else if((rawMin!==''&&(!Number.isFinite(min)||min<0))||(max!==null&&(!Number.isFinite(max)||max<0)))message='Enter a value of zero or greater.';else if(max!==null&&min>max)message='The maximum must be at least the minimum.';else if(s.mode==='slip'&&((max!==null&&max>5.0135)||min>5.0135))message='Choose fault slip within the recorded range, up to 5.0135 m.';const error=shell.querySelector('.gre-error[role="alert"]');if(error)error.textContent=message;return !message;}
  root.querySelectorAll('.gre-product').forEach(shell=>{const layout=shell.dataset.layout;states[layout]=cleanState(saved?.[layout]);states[layout].layout=layout;render(shell);
    shell.addEventListener('input',event=>{const el=event.target;if(el.matches('[data-number]')){states[layout][el.dataset.number]=el.value;const err=shell.querySelector('[role="alert"]');if(err)err.textContent='';store();}});
    shell.addEventListener('change',event=>{const el=event.target,s=states[layout];if(el.matches('[data-all]')){s[el.dataset.all]=el.checked?[]:[...defs[el.dataset.all].values];render(shell);store();}else if(el.matches('[data-mode]')){s.mode=el.dataset.mode;s.min='';s.max='';render(shell);store();}});
    shell.addEventListener('click',event=>{const el=event.target.closest('button');if(!el||el.disabled)return;const s=states[layout], previousStage=s.stage;if(el.dataset.choice){const key=el.dataset.choice,value=defs[key].values[Number(el.dataset.value)];s[key]=s[key].includes(value)?s[key].filter(v=>v!==value):[...s[key],value];}
      else if(el.dataset.measure!==undefined)s.measurement=Number(el.dataset.measure);
      else if(el.dataset.stage!==undefined){if(s.stage===2&&!validate(shell,s))return;s.stage=Number(el.dataset.stage);s.reviewReturn=false;}
      else if(el.dataset.edit){s.stage=Number(el.dataset.edit);s.reviewReturn=true;}
      else if(el.dataset.action==='next'){if(s.stage===2&&!validate(shell,s))return;s.stage=s.reviewReturn&&s.stage<3?3:Math.min(4,s.stage+1);s.reviewReturn=false;s.reached=Math.max(s.reached,s.stage);}
      else if(el.dataset.action==='back'){s.stage=Math.max(0,s.stage-1);s.reviewReturn=false;}
      else if(el.dataset.action==='sample'){s.dip=['30°','40°'];s.sediment=['Uniform: Strong','Layered: Strong'];s.mode='offset';s.max='3';s.stage=1;s.reached=Math.max(s.reached,1);}
      else if(el.dataset.action==='edit-site'||el.dataset.action==='edit-movement'){s.stage=el.dataset.action==='edit-site'?1:2;s.reviewReturn=true;}
      else if(el.dataset.action==='download'){shell.querySelector('.gre-status').textContent='This interaction prototype has no calculated data to download.';return;}
      else return;render(shell);if(s.stage!==previousStage){const target=s.layout==='steps'?shell.querySelector('.gre-main'):shell.querySelector('[data-stage="'+s.stage+'"].gre-sectionhead');target?.scrollIntoView({block:'nearest'});}store();
    });
    const design={hints:true,spacing:20};if(globalThis.Tweak){const tweak=new Tweak({container:shell,onChange:()=>{shell.dataset.hints=String(design.hints);shell.style.setProperty('--gre-space',design.spacing+'px');}});tweak.addToggle(design,'hints',{label:'Show supporting explanations'});}
  });
  window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.privateContent?.journeys;if(!next||JSON.stringify(next)===lastSaved)return;root.querySelectorAll('.gre-product').forEach(shell=>{const key=shell.dataset.layout;states[key]=cleanState(next[key]);states[key].layout=key;render(shell);});});
})();
</script>
